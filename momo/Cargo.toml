[package]
name = "shiguredo_momo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "WebRTC Native Client Momo"
readme = "../README.md"
homepage.workspace = true
repository.workspace = true
license.workspace = true

[[bin]]
name = "momo"
path = "src/main.rs"

[dependencies]
# 時雨堂クレート

# 2D グラフィックス描画 (フェイク映像生成)
raden.workspace = true
# ローカルのプレビュー映像表示
raw_player = { workspace = true, optional = true }
# 音声入出力デバイス (AudioCapture / AudioPlayback / ADM)
shiguredo_audio_device.workspace = true
# HTTP/1.1 のリクエスト・レスポンス処理 (metrics / P2P)
shiguredo_http11.workspace = true
# OpenH264 エンコーダー・デコーダー
shiguredo_openh264.workspace = true
# 映像入力デバイス (VideoCapture)
shiguredo_video_device.workspace = true
# WebRTC 本体 (PeerConnection / トラック / RTP コーデック等)
shiguredo_webrtc.workspace = true
# WebSocket クライアント (Ayame / P2P シグナリング)
shiguredo_websocket.workspace = true
# Sora 接続 SDK (sora モジュール / コーデック capability)
sora_sdk.workspace = true

# 外部クレート

# CLI 引数のパース
noargs.workspace = true
# JSON のパース・生成 (Ayame / P2P のシグナリングメッセージ)
nojson.workspace = true

# 暗号ライブラリ (乱数生成と rustls の暗号プロバイダで利用)
aws-lc-rs.workspace = true
# TLS 実装 (Ayame の wss 接続)
rustls.workspace = true
# PEM など PKI 関連の型定義 (Ayame シグナリング)
rustls-pki-types.workspace = true
# OS の証明書ストアを使ったサーバー証明書検証 (Ayame シグナリング)
rustls-platform-verifier.workspace = true
# 非同期ランタイム
tokio.workspace = true
# tokio 上で動く TLS ストリーム (Ayame の wss)
tokio-rustls.workspace = true
# 構造化ログ出力
tracing.workspace = true
# tracing のサブスクライバ初期化と環境変数フィルタ
tracing-subscriber.workspace = true

[target.'cfg(all(target_os = "linux", target_arch = "aarch64"))'.dependencies]
# 時雨堂クレート

# libcamera 経由の映像キャプチャ (Raspberry Pi)
shiguredo_libcamera = { version = "2026.1", optional = true }
# V4L2 M2M ハードウェア H.264 エンコーダー (Raspberry Pi)
# 2026.2.0 安定版に FnEncodeHandler 併用の H264Encoder が含まれるため canary 固定を解除する
shiguredo_v4l2 = { version = "2026.2", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# termios / fcntl などの低レベルシステムコール
libc = "0.2"

[features]
default = ["player"]
# AMD AMF ハードウェアエンコーダー・デコーダー
amf = ["sora_sdk/amf"]
# NVIDIA NVENC/NVDEC ハードウェアエンコーダー・デコーダー
nvcodec = ["sora_sdk/nvcodec"]
player = ["dep:raw_player"]
raspberrypi = ["dep:shiguredo_libcamera", "dep:shiguredo_v4l2"]
# Intel oneVPL ハードウェアエンコーダー・デコーダー
vpl = ["sora_sdk/vpl"]
