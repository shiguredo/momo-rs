[package]
name = "shiguredo_momo_moq"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "MOQT (Media over QUIC Transport) Client Momo"
homepage.workspace = true
repository.workspace = true
license.workspace = true

[[bin]]
name = "momo-moq"
path = "src/main.rs"

[dependencies]
# 時雨堂クレート

# 2D グラフィックス描画 (フェイク映像生成: media.rs)
raden.workspace = true
# ローカルのプレビュー映像表示と音声再生 (subscriber.rs)
raw_player.workspace = true
# 音声入力デバイス (AudioCapture)
shiguredo_audio_device.workspace = true
# OpenH264 エンコーダー・デコーダー (h264.rs)
shiguredo_openh264.workspace = true
# Opus エンコーダー・デコーダー (opus.rs)
shiguredo_opus.workspace = true
# 映像入力デバイス (VideoCapture)
shiguredo_video_device.workspace = true
# MOQT 本体 (client / publisher / subscriber)
shiguredo_moqt.workspace = true

# 外部クレート

# CLI 引数のパース (main.rs)
noargs.workspace = true
# バイト列操作 (QUIC ストリーム)
bytes.workspace = true

# TLS 実装 (QUIC 接続)
rustls.workspace = true
# PEM など PKI 関連の型定義 (QUIC 接続)
rustls-pki-types.workspace = true
# OS の証明書ストアを使ったサーバー証明書検証 (QUIC 接続)
rustls-platform-verifier.workspace = true
# QUIC クライアント (トランスポート)
s2n-quic.workspace = true
# 非同期ランタイム
tokio.workspace = true
# 構造化ログ出力
tracing.workspace = true
# tracing のサブスクライバ初期化と環境変数フィルタ (main.rs)
tracing-subscriber.workspace = true
