name: ci

on:
  push:
    paths:
      - "momo/**"
      - "momo-moq/**"
      - "sysroot/**"
      - "e2e-tests/**"
      - "pyproject.toml"
      - ".python-version"
      - "prek.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Makefile"
      - ".github/workflows/ci.yml"
  schedule:
    # JST 11:00 (UTC 02:00), 月-金
    - cron: "0 2 * * 1-5"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup update stable
      - run: cargo fmt --all --check

  prek:
    name: prek
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: j178/prek-action@7b101f8338a08d2bd6fdb3625e4e7692428763a3 # v3.1.1
        with:
          # cargo fmt / cargo clippy は Rust のジョブで検証するため、Python 系のフックだけを実行する
          extra-args: "--all-files --skip cargo-fmt --skip cargo-clippy"

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup update stable
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpulse-dev libx11-dev
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings
      - name: Build
        run: cargo build --workspace
      - name: Test
        run: cargo test --workspace
      - name: Upload binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: momo-linux-x86_64
          path: target/debug/momo
          retention-days: 1

  e2e-test:
    name: E2E Test
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: momo-linux-x86_64
          path: target/debug
      - name: Make binary executable
        run: chmod +x target/debug/momo
      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpulse0 libx11-6
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Run E2E tests
        run: uv run pytest -v

  raspberrypi-arm64-build:
    name: Raspberry Pi ARM64 Build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup update stable
      - name: Add Rust target
        run: rustup target add aarch64-unknown-linux-gnu
      - name: Install dependencies
        run: ./.devcontainer/install-deps.sh raspberrypi
      - name: Install cargo-shiguredo-sysroot
        run: cargo install shiguredo_sysroot
      - name: Install sysroot
        run: make sysroot-raspberry-pi
      - name: Clippy
        run: make sysroot-clippy-raspberry-pi
      - name: Build
        run: make sysroot-build-raspberry-pi-release

  ubuntu-arm64-build:
    name: Ubuntu ${{ matrix.version }} ARM64 Build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        version:
          - "26.04"
          - "24.04"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup update stable
      - name: Add Rust target
        run: rustup target add aarch64-unknown-linux-gnu
      - name: Install dependencies
        run: ./.devcontainer/install-deps.sh
      - name: Install cargo-shiguredo-sysroot
        run: cargo install shiguredo_sysroot
      - name: Install sysroot
        run: make sysroot-ubuntu-${{ matrix.version }}_arm64
      - name: Clippy
        run: make sysroot-clippy-ubuntu-${{ matrix.version }}_arm64
      - name: Build
        run: make sysroot-build-ubuntu-${{ matrix.version }}_arm64-release

  macos-build:
    name: macOS ${{ matrix.os }} Build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - xcode-27
          - macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup update stable
      - name: Clippy
        # macOS 上で momo-moq (MOQT モード) を含めてビルド・テストできることを検証する
        run: cargo clippy --workspace -- -D warnings
      - name: Build
        run: cargo build --workspace
      - name: Test
        run: cargo test --workspace

  windows-build:
    name: Windows x86_64 Build
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup update stable
      - name: Add Rust target
        run: rustup target add x86_64-pc-windows-msvc
      - name: Clippy
        # momo-moq は tobi-quic が POSIX ソケット前提で Windows ではコンパイルできないため momo だけを検証する
        run: cargo clippy -p shiguredo_momo -- -D warnings
      - name: Build
        run: cargo build -p shiguredo_momo
      - name: Test
        run: cargo test -p shiguredo_momo
      - name: Upload binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: momo-windows-x86_64
          path: target/debug/momo.exe
          retention-days: 1

  slack_notify:
    needs:
      - fmt
      - prek
      - build
      - e2e-test
      - raspberrypi-arm64-build
      - ubuntu-arm64-build
      - macos-build
      - windows-build
    timeout-minutes: 5
    runs-on: ubuntu-slim
    if: ${{ always() }}
    permissions:
      actions: read
    steps:
      - name: Slack Notification
        uses: shiguredo/github-actions/.github/actions/slack-notify@main
        with:
          status: ${{ job.status }}
          slack_webhook: ${{ secrets.SLACK_WEBHOOK }}
          slack_channel: momo
          notify_mode: failure_and_fixed
