[package]
name = "shiguredo_momo"
version = "2026.0.0"
edition = "2024"
rust-version = "1.98"
description = "WebRTC Native Client Momo"
readme = "README.md"
homepage = "https://github.com/shiguredo/momo-rs"
repository = "https://github.com/shiguredo/momo-rs"
license = "Apache-2.0"
include = ["/LICENSE", "/README.md", "/src/**"]

[[bin]]
name = "momo"
path = "src/main.rs"

[dependencies]
# 時雨堂クレート

# 2D グラフィックス描画 (フェイク映像生成: fake.rs)
raden = "2026.2"
# ローカルのプレビュー映像表示 (preview.rs)
raw_player = { version = "2026.2", optional = true }
# 音声入出力デバイス (AudioCapture / AudioPlayback / ADM)
shiguredo_audio_device = "2026.3"
# HTTP/1.1 のリクエスト・レスポンス処理 (metrics / P2P)
shiguredo_http11 = "2026.6"
# OpenH264 エンコーダー・デコーダー (openh264.rs)
shiguredo_openh264 = "2026.2"
# 映像入力デバイス (VideoCapture)
shiguredo_video_device = "2026.3"
# WebRTC 本体 (PeerConnection / トラック / RTP コーデック等)
# sora_sdk 2026.2.0-canary.3 が shiguredo_webrtc ~0.152.1-canary.2 を要求するため、
# 安定版 0.152.0 では解決不能になる。sora_sdk が 0.152.0 以上を許容する版を出すまでプレリリースに固定する
shiguredo_webrtc = "0.152.1-canary.2"
# WebSocket クライアント (Ayame / P2P シグナリング)
shiguredo_websocket = "2026.3"
# Sora 接続 SDK (sora モジュール / コーデック capability)
# DegradationPreference 設定 API が 2026.2.0-canary 系で初めて利用可能になったためプレリリースを使う。
# 安定版 2026.1.x は shiguredo_webrtc ~0.150 に固定する制約もあり追従できない
sora_sdk = "2026.2.0-canary.3"

# 外部クレート

# CLI 引数のパース (main.rs)
noargs = "0.4"
# JSON のパース・生成 (Ayame / P2P のシグナリングメッセージ)
nojson = "0.3"

# 暗号ライブラリ (乱数生成と rustls の暗号プロバイダで利用)
aws-lc-rs = "1.18"
# TLS 実装 (Ayame の wss 接続)
rustls = { version = "0.23", default-features = false, features = [
  "aws-lc-rs",
  "std",
  "tls12",
] }
# PEM など PKI 関連の型定義 (Ayame シグナリング)
rustls-pki-types = { version = "1.15", features = ["std"] }
# OS の証明書ストアを使ったサーバー証明書検証 (Ayame シグナリング)
rustls-platform-verifier = "0.7"
# 非同期ランタイム
tokio = { version = "1.53", features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "sync",
  "time",
] }
# tokio 上で動く TLS ストリーム (Ayame の wss)
tokio-rustls = { version = "0.26", default-features = false, features = [
  "aws-lc-rs",
] }
# 構造化ログ出力
tracing = "0.1"
# tracing のサブスクライバ初期化と環境変数フィルタ (main.rs)
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(all(target_os = "linux", target_arch = "aarch64"))'.dependencies]
# 時雨堂クレート

# libcamera 経由の映像キャプチャ (Raspberry Pi: libcamera.rs)
shiguredo_libcamera = { version = "2026.1", optional = true }
# V4L2 M2M ハードウェア H.264 エンコーダー (Raspberry Pi: v4l2_encoder.rs)
# 2026.2.0 安定版に FnEncodeHandler 併用の H264Encoder が含まれるため canary 固定を解除する
shiguredo_v4l2 = { version = "2026.2", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# termios / fcntl などの低レベルシステムコール (serial.rs)
libc = "0.2"

[features]
default = ["player"]
# AMD AMF ハードウェアエンコーダー・デコーダー
amf = ["sora_sdk/amf"]
# NVIDIA NVENC/NVDEC ハードウェアエンコーダー・デコーダー
nvcodec = ["sora_sdk/nvcodec"]
player = ["dep:raw_player"]
raspberrypi = ["shiguredo_libcamera", "shiguredo_v4l2"]
# Intel oneVPL ハードウェアエンコーダー・デコーダー
vpl = ["sora_sdk/vpl"]
